<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect to home page with hash for HashRouter
      // If there's a path, preserve it in the hash
      var path = window.location.pathname;
      if (path && path !== '/' && path !== '/index.html') {
        // Convert /blog/1 to #/blog/1
        window.location.replace('/#' + path);
      } else {
        window.location.replace('/#/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
